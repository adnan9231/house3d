<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
/* Layout: floating glass panels over the 3D scene; chips for toggles, round icon buttons top right, joysticks bottom corners (touch). */
:root{--bg:#e4ecf3;--panel:rgba(255,255,255,.74);--panel-s:rgba(255,255,255,.9);--fg:#16212c;--mute:#5a6a7a;--bd:rgba(22,33,44,.12);--chip:rgba(22,33,44,.06);--chip-h:rgba(22,33,44,.12);--ac:#b8472a;--ac-2:#d9693f;--ac-fg:#fff;--knob:#fff;--shadow:0 12px 32px rgba(16,30,46,.2),0 1px 0 rgba(255,255,255,.7) inset;--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--panel:rgba(20,29,40,.72);--panel-s:rgba(24,34,46,.92);--fg:#eaf0f6;--mute:#9badbd;--bd:rgba(255,255,255,.13);--chip:rgba(255,255,255,.07);--chip-h:rgba(255,255,255,.14);--ac:#ff8d66;--ac-2:#ffb08a;--ac-fg:#1c0d06;--knob:#2a394a;--shadow:0 12px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.07) inset}}
:root[data-theme="dark"]{--bg:#0e1620;--panel:rgba(20,29,40,.72);--panel-s:rgba(24,34,46,.92);--fg:#eaf0f6;--mute:#9badbd;--bd:rgba(255,255,255,.13);--chip:rgba(255,255,255,.07);--chip-h:rgba(255,255,255,.14);--ac:#ff8d66;--ac-2:#ffb08a;--ac-fg:#1c0d06;--knob:#2a394a;--shadow:0 12px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.07) inset}
html,body{height:100%;margin:0;background:var(--bg);font-family:var(--font);color:var(--fg);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{display:block;touch-action:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (pointer:coarse) and (orientation:portrait){html{overflow:hidden;background:#0e1620}body{position:fixed;left:0;top:0;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(100dvw) rotate(90deg)}}
#tAng{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:none;flex-direction:column;align-items:center;gap:6px;z-index:7;opacity:.22;transition:opacity .3s;font:700 10px/1 var(--font);color:rgba(255,255,255,.9);text-shadow:0 0 3px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
#tAng input{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:30px;height:min(34vh,170px);margin:0;accent-color:var(--ac);touch-action:none;cursor:pointer}

#tSpd.show{display:flex}#tSpd:hover,#tSpd:active{opacity:1}#tSpd button{border:0;border-radius:999px;padding:6px 14px;font:600 13px/1 var(--font);color:#fff;background:transparent;cursor:pointer;box-shadow:none;min-width:0}

#tSeekV{position:fixed;left:0;right:0;bottom:0;height:6px;display:none;z-index:8;pointer-events:none;background:transparent;overflow:hidden}

#tSeek[style*="block"]+#tSeekV{display:block}
#topR{transition:opacity .35s}#topR.tH{opacity:0;pointer-events:none}
#mm{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:none;background:none;border:0;box-shadow:none;pointer-events:none;width:246px;height:128px;z-index:5}

#ui{z-index:8;position:fixed;left:12px;top:calc(66px + env(safe-area-inset-top,0px));width:340px;max-width:calc(100vw - 24px);max-height:calc(100% - 96px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;box-sizing:border-box;background:var(--panel);border:1px solid var(--bd);border-radius:22px;padding:16px 16px 14px;backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:var(--shadow);scrollbar-width:thin}

#ui>p{margin:0 0 14px;font-size:12px;line-height:1.5;color:var(--mute);opacity:1}
.grp{margin:0 0 12px}.grp:last-child{margin-bottom:0}

button:hover{background:var(--chip-h)}
button:active{transform:scale(.96)}
button.tg::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute);opacity:.55;flex:none;transition:background .15s,box-shadow .15s,opacity .15s}
button.on{background:var(--ac);color:var(--ac-fg);box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 38%,transparent)}
button.on:hover{background:var(--ac-2)}
button.tg.on::before{background:var(--ac-fg);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ac-fg) 25%,transparent)}
input[type=date]{font:inherit;font-size:13px;font-weight:600;height:34px;box-sizing:border-box;padding:0 12px;border-radius:99px;border:1px solid var(--bd);background:var(--chip);color:var(--fg);flex:1 1 150px;min-width:0}
/* top-right controls */
#topR{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:calc(100vw - 24px)}
#topR button{height:42px;background:var(--panel);border:1px solid var(--bd);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:var(--shadow);padding:0 16px}

#topR #bWalk,#topR #bSnd,#topR #bGame,#topR #bView,#topR #bFS{width:42px;padding:0;justify-content:center;border-radius:50%}
#topR svg{display:block;pointer-events:none}
#topR button.on{background:var(--ac);color:var(--ac-fg);border-color:transparent}
#topR #bTour{background:linear-gradient(135deg,var(--ac-2),var(--ac));color:var(--ac-fg);border-color:transparent}
#topR #bTour.on{background:#c62828;color:#fff}
/* sun clock */
#sunClk{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);border-radius:20px;padding:10px 20px 12px;text-align:center;color:var(--fg);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--shadow);cursor:pointer;min-width:230px;max-width:calc(100vw - 260px)}
#scT{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
#scS{font-size:11.5px;font-weight:500;color:var(--mute);margin-top:3px}
#scL{font-size:11px;margin-top:7px;color:var(--mute)}
#scL b{display:inline-block;width:70px;height:6px;border-radius:99px;vertical-align:middle;margin:0 6px;background:linear-gradient(90deg,#2b6cff,#22d3ee,#facc15,#f97316,#ef2b2b)}
#scB{height:4px;border-radius:99px;background:var(--chip-h);margin-top:9px;overflow:hidden}
#scB i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac-2),var(--ac));border-radius:99px}
@media (max-width:700px){#sunClk{top:calc(62px + env(safe-area-inset-top,0px));max-width:calc(100vw - 24px)}}
/* touch joysticks */
.pad{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:none;width:136px;height:136px;border-radius:50%;z-index:7;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:radial-gradient(circle at 50% 40%,var(--panel-s),var(--panel));border:1px solid var(--bd);box-shadow:var(--shadow),inset 0 0 0 10px var(--chip);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.pad.show{display:block}
#padGL{left:calc(22px + env(safe-area-inset-left,0px))}#padGR{right:calc(22px + env(safe-area-inset-right,0px))}#padL{left:calc(22px + env(safe-area-inset-left,0px))}#padR{right:calc(22px + env(safe-area-inset-right,0px))}
.pad i{position:absolute;font:700 10px/1 var(--font);font-style:normal;letter-spacing:.04em;color:var(--mute);pointer-events:none}
.pad .t{left:50%;top:13px;transform:translateX(-50%)}.pad .b{left:50%;bottom:13px;transform:translateX(-50%)}.pad .l{left:14px;top:50%;transform:translateY(-50%)}.pad .r{right:14px;top:50%;transform:translateY(-50%)}
.pad b{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--panel-s),var(--knob));border:1px solid var(--bd);box-shadow:0 6px 16px rgba(0,0,0,.28);pointer-events:none;transition:transform .08s,background .15s}
.pad.dn b{background:radial-gradient(circle at 35% 30%,var(--ac-2),var(--ac));box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 55%,transparent)}
.seg{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:4px;padding:4px;border-radius:99px;background:var(--chip);border:1px solid var(--bd)}
.seg button{justify-content:center;height:34px;padding:0 8px;gap:6px;background:transparent;white-space:nowrap;min-width:0}
.seg button svg{flex:none}
.seg button.on{background:var(--ac);color:var(--ac-fg);box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 35%,transparent)}
#ui #sunClk{position:static;transform:none;left:auto;top:auto;min-width:0;max-width:none;margin-top:8px;padding:8px 12px 10px;border-radius:14px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;text-align:left;background:var(--chip);border:1px solid var(--bd)}#ui #scT{font-size:20px}#ui #scS{font-size:11px;line-height:1.35}
/* options panel: one consistent system — equal-width toggle tiles, one segmented control, one info card, hairline dividers between sections */
#ui .grp{margin:0}#ui .grp+.grp{margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
#ui .gl{margin:0 2px 9px}
#ui .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ui .row .tg{width:100%;height:40px;padding:0 12px;border-radius:12px;justify-content:flex-start;border:1px solid var(--bd);white-space:nowrap}
#ui .row .tg.on{border-color:transparent}
#ui .seg{border-radius:14px;padding:4px;gap:4px}
#ui .seg button{height:36px;border-radius:10px}
#ui #sunClk{margin-top:8px;padding:10px 14px 12px;border-radius:12px}
#ui #scT{font-size:22px;font-weight:700;letter-spacing:-.02em}
#ui #scS{margin-top:4px}
.pad{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.4);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.pad i{color:rgba(255,255,255,.75);text-shadow:0 0 3px rgba(0,0,0,.5)}
.pad b{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.55);box-shadow:none}
.pad.dn b{background:color-mix(in srgb,var(--ac) 45%,transparent);box-shadow:none}
@media (pointer:coarse),(hover:none){#cap{bottom:calc(176px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){button,#cap,#tSeek,.pad b{transition:none}}
/* mobile look area + height buttons */
#swipeR{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(46vw,260px);height:min(30vh,170px);border-radius:22px;border:1.5px dashed rgba(255,255,255,.5);background:rgba(255,255,255,.05);display:none;z-index:7;touch-action:none;user-select:none;-webkit-user-select:none}

#swipeR span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:600 12px/1.3 var(--font);color:rgba(255,255,255,.85);text-shadow:0 0 3px rgba(0,0,0,.6);pointer-events:none}
#hBtns{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(min(30vh,170px) + 24px + env(safe-area-inset-bottom,0px));display:none;gap:10px;z-index:7;align-items:center}

</style></head><body>
<div id="ui" style="display:none"><h1>Fegent Road – 4 bed family home</h1><p>Drag to look · tap to step forward, hold for more steps · scroll or pinch to zoom</p>

<div class="grp"><span class="gl">Light</span><div class="seg" role="radiogroup" aria-label="Lighting"><button id="bNight" role="radio" aria-checked="true" class="on">Night</button><button id="bDay" role="radio" aria-checked="false">Day</button><button id="bLive" role="radio" aria-checked="false">Current time</button></div>

ide or outside view" style="display:none"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button><button id="bFS" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="bTour">▶ Take tour</button><button id="bPanel">Options</button></div>

   if(tagAt){P.tag.visible=true;P.tag.position.set(tagAt[0],tagAt[1],tagAt[2]);const d=cam.position.distanceTo(P.tag.position),s=Math.max(1,d/9);P.tag.scale.set(1.25*s,.27*s,1)}else P.tag.visible=false})})();

 {const tr=$('topR'),gb=$('bGame');if(tr){if(gb&&gb.parentNode===tr)tr.insertBefore(btn,gb);else tr.appendChild(btn)}else document.body.appendChild(btn)}

 async function join(){const code=clean(iR.value);if(code.length<3){sSt.textContent='Pick a room code of at least 3 letters or numbers.';iR.focus();return}
